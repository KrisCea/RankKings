openapi: 3.1.0
info:
  title: RankKings Catalog Service API
  version: 1.0.0
  description: >-
    Lectura y creación del catálogo de obras. El gateway publica estas rutas
    bajo /api y las reenvía al catálogo. X-User-Id es un encabezado interno
    que solo debe inyectar el gateway tras validar la sesión.
servers:
  - url: http://localhost:8080/api
    description: API Gateway local
tags:
  - name: Items
paths:
  /items:
    post:
      tags: [Items]
      operationId: createItem
      summary: Crear una obra con portada
      description: >-
        El servidor genera el ID interno y la URL de portada. Los identificadores
        específicos de la categoría se envían separados y no sustituyen el ID.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [category, title, creatorName, identifiers, cover]
              properties:
                category:
                  $ref: "#/components/schemas/CategoryId"
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                creatorName:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                year:
                  type: integer
                  minimum: 1
                  maximum: 9999
                identifiers:
                  type: string
                  description: Objeto JSON con los identificadores propios de la categoría.
                cover:
                  type: string
                  format: binary
      responses:
        "201":
          description: Obra creada con ID y URL de portada generados por el servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankableItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /items/{itemId}:
    get:
      tags: [Items]
      operationId: getItemById
      summary: Obtener una obra por identificador
      description: >-
        savedByCurrentUser refleja la sesión cuando está autenticada; para
        visitantes debe ser false.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Obra encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankableItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /items/{itemId}/children:
    get:
      tags: [Items]
      operationId: getItemChildren
      summary: Listar los elementos hijos de una colección
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Obras hijas en orden de colección.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankableItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: rk_token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternativa para herramientas no navegador, si está habilitada.
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Sesión ausente, inválida o expirada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Obra o colección no encontrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    CategoryId:
      type: string
      enum: [music, podcasts, books, movies, concerts, videogames, art, boardgames]
    VerificationStatus:
      type: string
      enum: [verified, partial, unverified]
    Creator:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        linkedUserId:
          type: string
        linkedUsername:
          type: string
    ExternalLink:
      type: object
      additionalProperties: false
      required: [id, label, url, type]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [streaming, store, social, other]
    RankableItem:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - title
        - creator
        - uploadedBy
        - coverUrl
        - identifiers
        - verificationStatus
        - postId
        - averageRating
        - ratingsCount
        - childrenCount
        - savedByCurrentUser
        - savesCount
        - externalLinks
        - createdAt
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/CategoryId"
        title:
          type: string
        description:
          type: string
        creator:
          $ref: "#/components/schemas/Creator"
        uploadedBy:
          type: string
        year:
          type: integer
        coverUrl:
          type: string
          format: uri
        identifiers:
          type: object
          additionalProperties:
            type: string
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        postId:
          type: string
        averageRating:
          type: number
        ratingsCount:
          type: integer
          minimum: 0
        parentId:
          type: string
        position:
          type: integer
          minimum: 0
        childrenCount:
          type: integer
          minimum: 0
        childrenAverageRating:
          type: number
        savedByCurrentUser:
          type: boolean
        savesCount:
          type: integer
          minimum: 0
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
