openapi: 3.1.0
info:
  title: RankKings Social Service API
  version: 1.0.0
  description: >-
    Feed, publicaciones, interacciones y comentarios. El gateway reenvía también
    /users/{username}/posts y /items/{itemId}/reviews a este servicio antes de
    las rutas comodín de identidad y catálogo. X-User-Id es interno y solo debe
    ser inyectado por el gateway.
servers:
  - url: http://localhost:8080/api
    description: API Gateway local
tags:
  - name: Posts
  - name: Comments
  - name: Moderation
paths:
  /admin/moderation:
    get:
      tags: [Moderation]
      operationId: getModerationQueue
      summary: Listar contenido para moderación
      description: >-
        Solo administradores. La cola excluye cargas de medios incompletas.
        Ordena por submittedAt descendente y usa cursor opaco.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ModerationStatus"
          description: Estado a filtrar; por defecto pending.
          default: pending
        - name: type
          in: query
          schema:
            type: string
            enum: [all, post, review, comment, media]
          description: Tipo a filtrar; all mezcla todos los tipos.
          default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor opaco para la siguiente página.
      responses:
        "200":
          description: Página de elementos de moderación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationQueuePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /admin/moderation/{type}/{id}/approve:
    post:
      tags: [Moderation]
      operationId: approveModerationItem
      summary: Aprobar un elemento pendiente
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationType"
        - $ref: "#/components/parameters/ModerationId"
      responses:
        "200":
          description: Elemento aprobado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /admin/moderation/{type}/{id}/reject:
    post:
      tags: [Moderation]
      operationId: rejectModerationItem
      summary: Rechazar un elemento pendiente
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationType"
        - $ref: "#/components/parameters/ModerationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectModerationInput"
      responses:
        "200":
          description: Elemento rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts:
    get:
      tags: [Posts]
      operationId: getPosts
      summary: Obtener el feed de publicaciones
      description: >-
        Devuelve Post[]. La implementación actual del cliente no envía cursor,
        página ni límite; definir paginación y actualizar el cliente antes de
        activar scroll infinito.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Publicaciones visibles para el feed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Posts]
      operationId: createPost
      summary: Crear una publicación para una obra
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, caption]
              properties:
                itemId:
                  type: string
                  minLength: 1
                  description: Obra existente a la que se asocia la publicación.
                rankableItem:
                  $ref: "#/components/schemas/NewRankableItemInput"
                kind:
                  type: string
                  enum: [item]
                caption:
                  type: string
                  minLength: 1
                  maxLength: 2000
              oneOf:
                - required: [itemId]
                - required: [rankableItem]
      responses:
        "201":
          description: Publicación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/featured:
    get:
      tags: [Posts]
      operationId: getFeaturedPosts
      summary: Obtener publicaciones destacadas
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Publicaciones destacadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}:
    get:
      tags: [Posts]
      operationId: getPostById
      summary: Obtener una publicación por identificador
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Posts]
      operationId: deletePost
      summary: Eliminar una publicación propia o moderada
      description: >-
        Solo el autor o un administrador puede eliminar. Al eliminar una
        publicación kind=item se eliminan también la obra, sus reseñas,
        comentarios, archivos y publicaciones asociadas.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204":
          description: Publicación y contenido asociado eliminados.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /users/{username}/posts:
    get:
      tags: [Posts]
      operationId: getPostsByAuthor
      summary: Listar publicaciones por autor y tipo
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PostKind"
      responses:
        "200":
          description: Publicaciones del perfil.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /items/{itemId}/reviews:
    get:
      tags: [Posts]
      operationId: getReviewsForItem
      summary: Listar reseñas asociadas a una obra
      description: Cada reseña pertenece a la publicación principal de la obra y puede incluir contenido multimedia.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Reseñas de la obra.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews:
    post:
      tags: [Posts]
      operationId: addReview
      summary: Crear una reseña asociada a una publicación
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReviewInput"
      responses:
        "201":
          description: Reseña creada y asociada a la publicación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews/{reviewId}:
    delete:
      tags: [Posts]
      operationId: deleteReview
      summary: Eliminar una reseña propia o moderada
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "204":
          description: Reseña eliminada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews/{reviewId}/media/uploads:
    post:
      tags: [Posts]
      operationId: createReviewMediaUpload
      summary: Preparar la carga de una imagen para una reseña
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, sizeBytes]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                sizeBytes:
                  type: integer
                  minimum: 1
                  maximum: 10485760
      responses:
        "200":
          description: URL temporal para cargar la imagen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews/{reviewId}/media/{mediaId}/complete:
    post:
      tags: [Posts]
      operationId: completeReviewMediaUpload
      summary: Confirmar la carga de una imagen de reseña
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/ReviewId"
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Reseña con los medios actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews/{reviewId}/media/external:
    post:
      tags: [Posts]
      operationId: addReviewExternalMedia
      summary: Añadir un video o enlace externo a una reseña
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, type]
              properties:
                url:
                  type: string
                  format: uri
                type:
                  type: string
                  enum: [video, external]
      responses:
        "201":
          description: Reseña con el enlace externo añadido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/vote:
    post:
      tags: [Posts]
      operationId: toggleVote
      summary: Alternar el voto de la sesión actual
      description: La operación es un toggle y no es idempotente.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación con el estado de voto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/rating:
    put:
      tags: [Posts]
      operationId: ratePost
      summary: Crear o reemplazar una nota
      description: Una nota por usuario y publicación; score entre 1.0 y 10.0.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score]
              properties:
                score:
                  type: number
                  minimum: 1
                  maximum: 10
      responses:
        "200":
          description: Publicación con el promedio y nota actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Posts]
      operationId: unratePost
      summary: Eliminar la nota de la sesión actual
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación con promedios actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/share:
    post:
      tags: [Posts]
      operationId: sharePost
      summary: Compartir una publicación con un usuario
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipientId]
              properties:
                recipientId:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Publicación compartida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/comments:
    get:
      tags: [Comments]
      operationId: getComments
      summary: Listar comentarios de una publicación
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Comentarios y respuestas (máximo un nivel de anidación).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Comments]
      operationId: addComment
      summary: Crear un comentario o respuesta
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCommentInput"
      responses:
        "201":
          description: Comentario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /comments/{commentId}/like:
    post:
      tags: [Comments]
      operationId: toggleCommentLike
      summary: Alternar el like de un comentario
      description: La operación es un toggle y no es idempotente.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Comentario con el estado de like actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /comments/{commentId}:
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Marcar un comentario propio como eliminado
      description: >-
        Solo el autor o un administrador puede eliminar. Se conserva el
        comentario como tombstone para mantener las respuestas del hilo.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Comentario marcado como eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: rk_token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternativa para herramientas no navegador, si está habilitada.
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ModerationType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [post, review, comment, media]
    ModerationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Sesión ausente, inválida o expirada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: La sesión no tiene permiso para esta acción.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: El elemento ya no está pendiente de moderación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Publicación, comentario, usuario u obra no encontrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    NewRankableItemInput:
      type: object
      additionalProperties: false
      required: [category, title, creatorName, identifiers]
      properties:
        category:
          $ref: "#/components/schemas/CategoryId"
        title:
          type: string
          minLength: 1
          maxLength: 200
        creatorName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        year:
          type: integer
          minimum: 1
          maximum: 9999
        identifiers:
          type: object
          additionalProperties:
            type: string
    CategoryId:
      type: string
      enum: [music, podcasts, books, movies, concerts, videogames, art, boardgames]
    PostKind:
      type: string
      enum: [item, review]
    ModerationStatus:
      type: string
      enum: [approved, pending, rejected]
    ModerationQueuePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModerationQueueItem"
        page:
          type: object
          required: [limit, nextCursor, hasMore]
          properties:
            limit:
              type: integer
            nextCursor:
              type: [string, "null"]
            hasMore:
              type: boolean
    ModerationQueueItem:
      oneOf:
        - $ref: "#/components/schemas/ModerationPost"
        - $ref: "#/components/schemas/ModerationReview"
        - $ref: "#/components/schemas/ModerationComment"
        - $ref: "#/components/schemas/ModerationMedia"
      discriminator:
        propertyName: type
        mapping:
          post: "#/components/schemas/ModerationPost"
          review: "#/components/schemas/ModerationReview"
          comment: "#/components/schemas/ModerationComment"
          media: "#/components/schemas/ModerationMedia"
    ModerationEntry:
      type: object
      required: [id, type, status, submittedAt, author, content]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [post, review, comment, media]
        status:
          $ref: "#/components/schemas/ModerationStatus"
        submittedAt:
          type: string
          format: date-time
        author:
          type: object
          required: [id, username]
          properties:
            id:
              type: string
            username:
              type: string
    ModerationPost:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: post
            content:
              type: object
              required: [kind, caption, item]
              properties:
                kind:
                  type: string
                  enum: [item]
                caption:
                  type: string
                item:
                  type: object
                  required: [id, title, category, coverUrl]
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    category:
                      $ref: "#/components/schemas/CategoryId"
                    coverUrl:
                      type: [string, "null"]
                      format: uri
    ModerationReview:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: review
            content:
              type: object
              required: [postId, itemId, text, authorScore]
              properties:
                postId:
                  type: string
                itemId:
                  type: string
                text:
                  type: string
                authorScore:
                  type: [number, "null"]
                  minimum: 1
                  maximum: 10
    ModerationComment:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: comment
            content:
              type: object
              required: [postId, text]
              properties:
                postId:
                  type: string
                parentId:
                  type: [string, "null"]
                text:
                  type: string
    ModerationMedia:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: media
            content:
              type: object
              required: [postId, mediaType, url, isCover]
              properties:
                postId:
                  type: string
                mediaType:
                  $ref: "#/components/schemas/MediaType"
                url:
                  type: string
                  format: uri
                contentType:
                  type: [string, "null"]
                isCover:
                  type: boolean
    ModerationDecision:
      type: object
